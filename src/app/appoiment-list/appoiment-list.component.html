<div class="container">
    <div class="card mt-3">
        <div class="row">
            <div class="col">
                <h2 class="text-center">Create New Appoiment</h2>
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-6">
            <input class="form-control" [(ngModel)]="newTitle" type="text" placeholder="Enter title">
        </div>
        <div class="col-md-4">      
        <input class="form-control"  [(ngModel)]="newDate" type="date" >
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" (click)="addAppoiment()">Add</button>
        </div>
    </div>

    <h2 class="text-center mt-5">Appoiments</h2>

    <ul class="list-item mt-3 border-1">
        <li class="list-group-item d-flex justify-content-between p-2 align-items-center" *ngFor="let appmnt of appoiments; index as i">
            {{appmnt.title}}   {{appmnt.date}}
            <button class="btn btn-danger mt-2" (click)="deleteappoiment(i)">Delete</button>
        </li>
    </ul>

</div>
